# Pre-commit hooks — run `pre-commit install` once to enable on every commit.
# Manual run: `pre-commit run --all-files`

repos:
  # Standard hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements          # blocks accidental pdb/breakpoint() commits

  # Ruff: lint + auto-fix + format. One tool, two hooks.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Integridad del backlog (tarea 66).
  #
  # OJO — ESTE HOOK NO ES EL CABLEADO OPERATIVO (tarea 97). Nadie corrió
  # `pre-commit install` en este repo: `.git/hooks/` tiene sólo archivos `.sample`
  # y `core.hooksPath` está vacío en los tres niveles, así que entre el 2026-09-01
  # y el 2026-09-03 esta declaración **no se ejecutó ni una vez** mientras
  # `CLAUDE.md` y el backlog afirmaban que sí. Desde el 2026-09-03 el guard vive
  # en el **paso 3a de `/ship`**, al lado de `check_repo_health.py --staged`.
  # Esta entrada queda como conveniencia para quien SÍ instale pre-commit — no
  # como la red de la que depende el backlog.
  #
  # Corre SOLO si el commit toca `docs/BACKLOG.md`, que es el único momento en
  # que puede romperlo.
  #
  # El 2026-08-31 un commit de cierre le sacó 767 líneas —todas las tareas y
  # cinco secciones enteras— y pasó invisible durante cuatro commits: nada en la
  # suite cubría ese archivo, `git status` salía limpio y el CI estaba verde. El
  # `--staged` es la mitad que sólo se puede ver acá: mirando el diff contra el
  # índice, no leyendo el archivo. La otra mitad (secciones, punteros) corre
  # además en la suite, o sea en el CI, por si alguien no instaló pre-commit.
  - repo: local
    hooks:
      - id: backlog-integrity
        name: docs/BACKLOG.md no perdió secciones ni media cola
        entry: python scripts/check_backlog_integrity.py --staged
        language: system
        files: ^docs/BACKLOG\.md$
        pass_filenames: false

  # mypy is intentionally NOT in pre-commit by default — it's slow and
  # currently best-effort. Run manually with `mypy .` or via CI.
