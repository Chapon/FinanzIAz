name: CI

# Triggers on pushes/PRs to the main branch. The matrix stays small on
# purpose — adding more Python versions later is one line per entry.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel an in-progress run when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: mypy (best-effort)
    runs-on: ubuntu-latest
    # Best-effort: don't fail the whole pipeline yet — we're migrating
    # to type hints incrementally. Flip ``continue-on-error`` to ``false``
    # once mypy passes cleanly across the codebase.
    #
    # OJO con la lectura de este job (tarea 65): hasta 2026-08-31 salía con
    # **exit 2**, que en mypy es un error BLOQUEANTE, no errores de tipo — moría
    # resolviendo módulos y no chequeaba nada. O sea que su rojo no significaba
    # "faltan tipos": significaba "mypy no arrancó". Arreglado en `pyproject.toml`
    # (`explicit_package_bases`); ahora el rojo sí es la deuda de tipado real,
    # medida en 1074 errores sobre 158 de 323 archivos.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: mypy
        run: mypy .

  audit:
    name: security audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory only, doesn't block merges
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install + audit
        # Mismo patrón que el paso de pytest: los logs de Actions piden token, así
        # que el propio job publica su salida como anotación cuando falla. Sin
        # esto, `pip-audit` sólo dejaba "Process completed with exit code 1" y no
        # se podía saber si el rojo era una CVE real o un fallo de instalación.
        # `set +e` porque Actions corre los `run` con `bash -e`. Tarea 65.
        run: |
          set +e
          set -o pipefail
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit --strict 2>&1 | tee audit-output.txt
          code=$?
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 3500 audit-output.txt \
              | python3 -c 'import sys;print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
            echo "::error title=pip-audit salió con $code::$msg"
          fi
          exit $code

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Qt shared libs (headless)
        # PyQt6 se enlaza contra libEGL/libGL, y el runner de Ubuntu no las trae.
        # Sin esto, ``pytest-qt`` explota importando ``PyQt6.QtGui`` DENTRO de
        # ``pytest_configure`` —un hook histórico— así que la excepción escapa de
        # ``_do_configure`` y mata la sesión entera con INTERNALERROR (exit 3),
        # antes de recolectar un solo test:
        #
        #     ImportError: libEGL.so.1: cannot open shared object file
        #
        # OJO con la explicación vieja, que estuvo acá y era FALSA: no es el plugin
        # de plataforma ``xcb``, y por eso ``QT_QPA_PLATFORM=offscreen`` nunca
        # alcanzó. Esto falla al **cargar la librería compartida**, antes de que Qt
        # llegue a elegir plataforma; ``offscreen`` sólo importa después. Tarea 65.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        # Skip tests marked ``network`` — they hit real yfinance and don't
        # belong in CI.
        # QT_QPA_PLATFORM=offscreen: tres módulos de test importan PyQt6 al
        # recolectar, y sin framebuffer el plugin de plataforma por defecto no
        # levanta. Hace falta, pero NO era la causa del exit 3 — ver el paso de
        # las libs de Qt más arriba.
        #
        # El tail del output se emite como ``::error::`` cuando el paso falla, y
        # eso no es cosmético: los LOGS de Actions piden autenticación, así que un
        # job que sólo deja "Process completed with exit code 3" es indiagnosticable
        # para quien no tenga token. La API de anotaciones sí responde sin token, y
        # ``::error::`` escribe ahí. Tarea 65.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # `set +e` es obligatorio: Actions corre los `run` con `bash -e`, así que
          # sin esto el paso aborta en el fallo de pytest y la anotación —que es
          # justo lo que se quiere leer— nunca se emite. `pipefail` hace que $?
          # sea el código de pytest y no el de `tee`.
          set +e
          set -o pipefail
          pytest -ra -m "not network" 2>&1 | tee pytest-output.txt
          code=$?
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 3500 pytest-output.txt \
              | python3 -c 'import sys;print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
            echo "::error title=pytest salió con $code::$msg"
          fi
          exit $code
