# Alembic configuration for FinanzIAs.
#
# The DB URL is resolved at runtime from ``database.models.DB_PATH`` via
# ``alembic/env.py`` so this file doesn't need to be edited per machine.
#
# Common commands
# ---------------
#   alembic current                    # see current revision
#   alembic history                    # list revisions
#   alembic revision --autogenerate -m "add foo"
#   alembic upgrade head               # apply all pending migrations
#   alembic stamp head                 # mark DB as up-to-date without running

[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40

# URL is overridden in env.py — keep this empty.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
