# ─────────────────────────────────────────────────────────────────────────────
# FinanzIAs — project metadata + tool configuration
#
# This file is purely declarative. It does NOT replace requirements.txt as the
# install spec — pip continues to use requirements.txt / requirements.lock.
# Its purpose here is to centralize linter / formatter / type-checker config.
#
# Recommended workflow
# --------------------
#     pip install -r requirements-dev.txt
#     ruff check .            # lint
#     ruff format .           # format
#     mypy .                  # type check (best-effort, gradual)
#     pre-commit run --all    # all of the above + extras
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "finanzias"
version = "1.0.0"
description = "Aplicación de seguimiento de cartera, paper trading y análisis cuantitativo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }


# ── Ruff ─────────────────────────────────────────────────────────────────────
# https://docs.astral.sh/ruff
# Ruff replaces flake8 + isort + (mostly) pylint and has a built-in formatter
# that's a drop-in replacement for black.

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
# Ruleset rationale:
#   E,W   pycodestyle base
#   F     pyflakes (undefined names, unused imports, …)
#   I     isort (import ordering)
#   B     flake8-bugbear (likely-bug patterns)
#   UP    pyupgrade (modern Python syntax)
#   SIM   flake8-simplify (idiomatic refactors)
#   RUF   ruff-native rules
#   T10   flake8-debugger (pdb / breakpoint() olvidados)
#
# T10 entra en la tarea 97, y con un motivo puntual: el `breakpoint()` olvidado lo
# cubría el hook `debug-statements` de `.pre-commit-config.yaml`, y ese hook **no
# corre** — nadie ejecutó `pre-commit install` y el cableado operativo del proyecto
# es `/ship`, no un hook de git. Ruff sí corre (CI + criterio de "done"), así que
# la regla se muda acá en vez de quedar declarada en un archivo inerte.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "T10"]

# Pragmatic ignores for this codebase (mostly UI-heavy PyQt + analytics code):
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment — used a lot in analysis modules
    "E741",   # ambiguous variable name (e.g. `l` in pandas idioms)
    "B008",   # function call in default arg (Qt idioms occasionally need this)
    "SIM108", # ternary "simplification" sometimes hurts readability
    "RUF012", # mutable class attribute on dataclass — too noisy for our PyQt widgets

    # Unicode in code/docstrings/comments is intentional in this project:
    # • σ, α, β — math symbols in GARCH / quant docs
    # • × — used in unit ratios ("1.5×")
    # • – / — — em / en dashes in user-facing strings
    # • • / → — bullets / arrows in UI labels and tooltips
    # The "ambiguous unicode" warnings would force ASCII rewrites that
    # hurt readability for legitimate domain notation. Ignore globally.
    "RUF001", # ambiguous unicode in string literals
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments

    # E402 — module-level import not at top of file. Triggers because we
    # initialize the logger (``log = get_logger(__name__)``) before some
    # local-import blocks. That's an intentional pattern, not a smell.
    "E402",
]

# Tests can use longer lines, magic-value comparisons, etc.
per-file-ignores = { "tests/**" = ["E501", "S101", "PLR2004"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false


# ── mypy (gradual typing) ────────────────────────────────────────────────────
# https://mypy.readthedocs.io
# We run mypy in "best-effort" mode — strict on our own modules, lenient on
# third-party libraries that ship without stubs (yfinance, mplfinance, …).

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true     # third-party stubs are inconsistent
exclude = ["build/", "dist/", "venv/", ".venv/"]

# `scripts/` no tiene __init__.py: en runtime funciona como namespace package
# porque los runners hacen `sys.path.insert(0, repo_root)`. Sin declarar la base,
# mypy veía `scripts/harvest_catalysts.py` con DOS nombres a la vez
# (`harvest_catalysts` y `scripts.harvest_catalysts`) y moría con un error
# BLOQUEANTE — exit 2, sin llegar a chequear un solo tipo. O sea que el job no
# estaba siendo "best-effort": no estaba corriendo. Es la resolución (b) que
# recomienda el propio mypy. Tarea 65.
mypy_path = "."
explicit_package_bases = true

# Per-module overrides — start permissive, tighten later.
[[tool.mypy.overrides]]
module = ["ui.*"]
disable_error_code = ["misc", "no-untyped-def"]   # PyQt subclassing noise


# ── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: tests that hit the real Yahoo Finance API (skip in CI)",
    "real_db: opt-out del rebind in-memory del guard autouse — desde la tarea 108 el test cae en la DB de archivo de la sesión (FINANZIAS_DB_PATH), NO en producción. Hoy no lo usa nadie",
]
